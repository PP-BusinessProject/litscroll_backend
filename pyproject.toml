[project]
  name = 'liscroll-backend'
  version = '0.1.0'
  description = 'Add your description here'
  readme = 'README.md'
  requires-python = '==3.14.*'
  dependencies = [
    'asyncclick==8.3.0.7',
    'asyncpg==0.31.0',
    'colorlog==6.10.1',
    'fs==2.4.16',
    'python-dateutil==2.9.0.post0',
    'regex==2026.4.4',
    'sqlalchemy==2.0.49',
  ]
[project.optional-dependencies]
  linux = ['uvloop==0.22.1']
[dependency-groups]
  api = ['uvicorn==0.49.0', 'fastapi==0.139.0', 'pydantic-settings==2.14.2']
  dev = ['jurigged==0.6.1', 'pyright==1.1.409', 'ruff==0.15.12']
  db = ['inflect==7.5.0', 'psycopg[binary,pool]==3.3.4']
  db_dev = ['alembic==1.18.4', 'click==8.3.3']
  test = ['pytest==9.1.1', 'httpx==0.28.1', 'pytest-asyncio==1.4.0']

[tool.pytest.ini_options]
  minversion = "8.0"
  testpaths = ["litscroll_test/api"]
  python_files = ["test_*.py"]
  python_classes = ["Test*"]
  python_functions = ["test_*"]
  asyncio_mode = "auto"
  addopts = ["-v", "--tb=short", "--strict-markers", "--disable-warnings"]
  markers = [
    "api: API integration tests",
    "repository: Repository tests",
    "service: Service tests",
    "db: Database tests",
  ]

[tool.ruff]
  line-length = 79
  indent-width = 4
  exclude = [
    '.bzr',
    '.direnv',
    '.eggs',
    '.git',
    '.git-rewrite',
    '.hg',
    '.ipynb_checkpoints',
    '.mypy_cache',
    '.nox',
    '.pants.d',
    '.pyenv',
    '.pytest_cache',
    '.pytype',
    '.ruff_cache',
    '.svn',
    '.tox',
    '.venv',
    '.vscode',
    '.pyi',
    '.pyc',
    '__pypackages__',
    '__pycache__',
    '_build',
    'buck-out',
    'build',
    'dist',
    'node_modules',
    'site-packages',
    'venv',
    'typings',
  ]

[tool.ruff.lint]
  select = ['E4', 'E7', 'E9', 'F']
  ignore = []
  fixable = ['ALL']
  unfixable = []
  dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[tool.ruff.lint.isort]
  combine-as-imports = true
  lines-after-imports = 2

[tool.ruff.format]
  quote-style = 'single'
  indent-style = 'space'
  skip-magic-trailing-comma = false
  line-ending = 'auto'
  docstring-code-format = false
  docstring-code-line-length = 'dynamic'

[tool.ruff.mccabe]
  max-complexity = 10
